name: pagewatcher_mobile
description: PageWatcher mobile app — AI-powered website change monitoring for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, routing, networking
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.8.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Auth
  google_sign_in: ^7.1.0
  sign_in_with_apple: ^7.0.1

  # Misc
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
